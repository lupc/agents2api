[package]
name = "agents2api"
version = "2.0.0"
edition = "2021"
description = "CodeBuddy/WorkBuddy subscription to OpenAI/Anthropic-compatible local API, in Rust"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
regex = "1"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
bytes = "1"

[profile.release]
opt-level = 2
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
